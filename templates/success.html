<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - CDPIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg text-center">
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Diagnostic initié</h1>
        <p class="text-slate-600 mb-8">Merci <strong>{{ company_name }}</strong>. Nous avons bien reçu vos informations.</p>
        
        <div class="border-t border-gray-200 pt-6">
            <a href="mailto:contact@humans-and-ai.ca?subject=Demande d'accès à la bibliothèque - {{ company_name }}" class="inline-block w-full bg-slate-800 text-white font-bold py-3 px-4 rounded-md hover:bg-slate-900 transition duration-150 mb-4">
                Demander l'accès à la bibliothèque
            </a>
            <a href="/cdpia" class="inline-block w-full text-slate-500 hover:text-slate-700 underline text-sm transition duration-150">
                Retour à l'accueil
            </a>
        </div>
    </div>
</body>
</html>
